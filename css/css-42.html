<body><header><div class="container"><h1>CSS 42: Button hover animation</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>CSS Practical 42</p><p>Button hover animation.</p><div class='demo'><button style='transition:.3s' onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 8px 15px #aaa'" onmouseout="this.style.transform='none';this.style.boxShadow='none'">Animated Button</button></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
