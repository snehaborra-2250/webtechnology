<body><header><div class="container"><h1>JavaScript 34: Stopwatch</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 34</p><p>Stopwatch.</p><div class='demo'><p id="sw">00:00</p><button onclick="start()">Start</button> <button onclick="stop()">Stop</button><script>let sec=0,t;function start(){clearInterval(t);t=setInterval(()=>{sec++;sw.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`},1000)}function stop(){clearInterval(t)}</script></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
