<body><header><div class="container"><h1>JavaScript 8: Prime number</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 8</p><p>Prime number.</p><div class='demo'><input id="n" type="number" value="17"><button onclick="let n=+document.getElementById('n').value,p=n>1;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)p=false;document.getElementById('out').textContent=p?'Prime':'Not Prime'">Check</button><p id="out"></p></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
