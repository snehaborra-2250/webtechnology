<body><header><div class="container"><h1>JavaScript 35: Countdown timer</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 35</p><p>Countdown timer.</p><div class='demo'><p id="timer">10</p><button onclick="let n=10;timer.textContent=n;let t=setInterval(()=>{timer.textContent=--n;if(n===0)clearInterval(t)},1000)">Start Countdown</button></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
