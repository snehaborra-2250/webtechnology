<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<body><header><div class="container"><h1>JavaScript 27: Simple calculator</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 27</p><p>Simple calculator.</p><div class='demo'><input id="x" type="number" value="10"><input id="op" value="+"><input id="y" type="number" value="5"><button onclick="let a=+x.value,b=+y.value,o=op.value,r=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b;document.getElementById('out').textContent=r">Calculate</button><p id="out"></p></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
