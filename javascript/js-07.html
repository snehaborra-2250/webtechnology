<body><header><div class="container"><h1>JavaScript 7: Fibonacci series</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 7</p><p>Fibonacci series.</p><div class='demo'><input id="n" type="number" value="8"><button onclick="let n=+document.getElementById('n').value,a=0,b=1,s=[];for(let i=0;i<n;i++){s.push(a);[a,b]=[b,a+b]}document.getElementById('out').textContent=s.join(' ')">Generate</button><p id="out"></p></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
