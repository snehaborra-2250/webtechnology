<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<body><header><div class="container"><h1>JavaScript 14: Sum and average of array</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 14</p><p>Sum and average of array.</p><div class='demo'><input id="n" value="10,20,30,40"><button onclick="let a=document.getElementById('n').value.split(',').map(Number);document.getElementById('out').textContent=`Sum=${a.reduce((x,y)=>x+y,0)}, Average=${a.reduce((x,y)=>x+y,0)/a.length}`">Calculate</button><p id="out"></p></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
