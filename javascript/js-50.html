<body><header><div class="container"><h1>JavaScript 50: Perfect number</h1><nav><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav></div></header>
<main class="container"><div class='card'><p class='badge'>JavaScript Practical 50</p><p>Perfect number.</p><div class='demo'><input id="n" value="28"><button onclick="let n=+n.value,s=0;for(let i=1;i<n;i++)if(n%i===0)s+=i;out.textContent=s===n?'Perfect':'Not Perfect'">Check</button><p id="out"></p></div></div></main><footer>HTML, CSS & JavaScript Practical Programs</footer></body></html>
